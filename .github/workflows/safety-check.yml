name: Safety Check

# Block merges/pushes that contain known-bad strings or broken structure.
# Each check runs as a separate step so failures are easy to diagnose.
# Hard checks fail the build. Soft checks emit warnings only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  safety:
    runs-on: ubuntu-latest
    env:
      # [WAVE0-T03] SHIPPING SURFACES - the paths a visitor can actually reach.
      #
      # WHY THIS EXISTS. Three of the hard checks below scanned `.` with
      # `--include="*.md" --include="*.txt"`, which means a sprint report that
      # QUOTES a banned string fails the build. Not hypothetical: the
      # `Y7 AGENCY` step had exactly ONE match in the whole repository, inside
      # INTL_FIX_REPORT.md - a document whose subject is that the string is
      # ABSENT from src/. The job died on it at step 2 and never reached the
      # address check below, so every run since at least 2026-07-16 failed for
      # a reason unrelated to any shipping surface.
      #
      # Documentation must be able to name the thing it documents.
      #
      # scripts/ is in scope (generateSitemap.js and prerender.mjs carry route
      # and copy strings) but scripts/world.geo.json is excluded per-rule where
      # it matters: it is 250KB of polygon coordinates and the substring
      # "12.02464" is a latitude, not a ZIP code.
      SHIP: "src public index.html server.js scripts"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # HARD CHECKS â€” fail the build if any match found
      # ============================================================

      - name: Check for old MC number (1677498)
        # [WAVE0-T03] Scoped to $SHIP. Was failing on docs/audits/WEBGEO_PHASE0.md,
        # which records that the number does NOT appear on the site.
        run: |
          if grep -rn "1677498" \
              --include="*.jsx" --include="*.js" --include="*.ts" --include="*.tsx" \
              --include="*.html" --include="*.json" --include="*.txt" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist $SHIP; then
            echo "::error::Found old MC number 1677498. Current MC is 1741537. See [FIX-02] commit from April 5."
            exit 1
          fi
          echo "OK: no 1677498 references"

      - name: Check for old brand 'Y7 AGENCY'
        # [WAVE0-T03] Scoped to $SHIP, and *.md dropped from the include list.
        # The only match repo-wide was INTL_FIX_REPORT.md recording that the
        # string does not appear in src/. That single match failed this
        # workflow on every run for at least 47 days.
        run: |
          if grep -rn "Y7 AGENCY" \
              --include="*.jsx" --include="*.js" --include="*.ts" --include="*.tsx" \
              --include="*.html" --include="*.json" --include="*.txt" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist $SHIP; then
            echo "::error::Found old brand 'Y7 AGENCY' on a shipping surface. Current brand is 'Y7 Logistics' (legal: Y7 Consulting Inc)."
            exit 1
          fi
          echo "OK: no 'Y7 AGENCY' references on shipping surfaces"

      - name: Check for dispatch@ email
        # [WAVE0-T03] Scoped to $SHIP, and CareerApplication.jsx is EXEMPT.
        #
        # dispatch@ is the carrier/driver mailbox (P3_FIX_REPORT.md:21 -
        # "customer-facing: No, internal only"). The careers form is the one
        # public surface whose audience IS carriers, so the address is correct
        # there, and the rule now says so instead of being quietly violated.
        # Every other shipping surface is a customer screen and must use info@;
        # WAVE0-T03 moved the four that did not (portal/Locations.jsx,
        # portal/OrderDetail.jsx, portal/Profile.jsx x2).
        #
        # ONE line inside a covered file is also exempt, by an inline marker
        # rather than by dropping the file: OrderDetail.jsx renders the Zelle
        # RECIPIENT, which must equal ZELLE_RECIPIENT in TRANSPORT
        # services/email_templates.py:384. That is a money instruction the
        # customer already received by email; rewriting it to info@ to satisfy
        # this rule would misdirect payments. Mark such a line with
        # `wave0-allow-dispatch` and say why, at the line.
        run: |
          HITS=$(grep -rn "dispatch@y7agency" \
              --include="*.jsx" --include="*.js" --include="*.ts" --include="*.tsx" \
              --include="*.html" --include="*.json" --include="*.txt" \
              --exclude=CareerApplication.jsx \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist $SHIP \
              | grep -v "wave0-allow-dispatch" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Found dispatch@y7agency on a customer-facing surface. dispatch@ is the carrier mailbox; customer screens use info@y7agency.com. CareerApplication.jsx is exempt (carrier audience); a single line may be exempted with a wave0-allow-dispatch marker and a stated reason."
            exit 1
          fi
          echo "OK: dispatch@ appears only where its audience is carriers"

      - name: Check for old Wix phone (857-895-8555)
        # [WAVE0-T03] Scoped to $SHIP. Was failing on WEBGEO_PHASE0.md and
        # T06_copy_sweep.txt, both of which record its absence from src/.
        run: |
          if grep -rnE "857.{0,5}895" \
              --include="*.jsx" --include="*.js" --include="*.ts" --include="*.tsx" \
              --include="*.html" --include="*.json" --include="*.txt" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist $SHIP; then
            echo "::error::Found old Wix phone number (857-895-xxxx). Public site has no phone numbers."
            exit 1
          fi
          echo "OK: no 857-895 references"

      - name: Check for fake VOIP phone (617-010-xxxx)
        # [WAVE0-T03] Scoped to $SHIP for consistency with its two siblings.
        # This one passes today; the scoping is what keeps it passing when an
        # audit quotes the number.
        run: |
          if grep -rnE "617.{0,5}010" \
              --include="*.jsx" --include="*.js" --include="*.ts" --include="*.tsx" \
              --include="*.html" --include="*.json" --include="*.txt" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist $SHIP; then
            echo "::error::Found fake VOIP phone (617-010-xxxx). Public site has no phone numbers."
            exit 1
          fi
          echo "OK: no 617-010 references"

      - name: Check for tel links (no colon)
        run: |
          if grep -rnE 'href=.tel:' \
              --include="*.jsx" --include="*.js" --include="*.ts" --include="*.tsx" \
              --include="*.html" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist .; then
            echo "::error::Found tel: link. Public site has no clickable phone numbers."
            exit 1
          fi
          echo "OK: no tel: links"

      - name: Check for telephone field in JSON-LD
        run: |
          if grep -rn '"telephone"' \
              --include="*.jsx" --include="*.js" --include="*.ts" --include="*.tsx" \
              --include="*.html" --include="*.json" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist .; then
            echo "::error::Found 'telephone' field in JSON-LD schema. Remove it - public site has no phone."
            exit 1
          fi
          echo "OK: no telephone JSON-LD field"

      - name: Check the SUPERSEDED office address is not published (both alphabets)
        # [WAVE0-T03] THE POLARITY OF THIS RULE IS REVERSED.
        #
        # It used to ban `6 Harding` / `Natick` / `01760` on the theory that
        # Natick was the FMCSA registered-agent address and Newton was the
        # office (LEGAL-ACCURACY, d6f7bbe, 2026-04-20). That policy was later
        # flipped: 6 Harding Rd, Natick, MA 01760 IS the canonical public
        # address, and CO5-T02 swept it onto every generated document. The rule
        # was never updated, so it banned the correct address and matched 44
        # times - while never executing, because an earlier step killed the job.
        #
        # BOTH ALPHABETS, AND THAT IS THE POINT. Every sweep before this one
        # was latin-only, and src/locales/ua/faq.json:10 survived all of them:
        #   "iz holovnym ofisom u Ньютоні" - Newton, declined, in Cyrillic.
        # A rule written in one alphabet rebuilds the same blindness facing the
        # other way. The Cyrillic stem is banned outright: measured at
        # 08c7565f, it had exactly ONE occurrence on any shipping surface and
        # that occurrence was the defect. The RU/UA service-area copy spells
        # the city in latin ("Newton, MA"), so there is no legitimate Cyrillic
        # use to protect. If one is ever wanted, amend this rule deliberately.
        #
        # WHAT THIS DOES NOT CATCH, stated so nobody assumes otherwise: a
        # paraphrase that names no address at all. src/locales/*/services.json
        # said "Our home base" of a Newton section; WAVE0-T02b rewrote those
        # four strings, but a grep cannot police a claim with no place-name in
        # it. This rule covers the address, not every way of implying one.
        #
        # world.geo.json is excluded: it is polygon coordinates, and the
        # substring "12.02464" in Somalia's outline is a latitude, not a ZIP.
        run: |
          if grep -rnE -e "1007 Chestnut" -e "Chestnut St" -e "02464" -e "02458" \
              -e "Ньютон" -e "Нютон" \
              -e "based in Newton" -e "siedzibą w Newton" -e "из Newton" \
              -e "Newton,? (MA|Massachusetts)-based" -e "[Oo]ur (local )?Newton office" \
              --include="*.jsx" --include="*.js" --include="*.ts" --include="*.tsx" \
              --include="*.html" --include="*.json" --include="*.txt" --include="*.xml" \
              --exclude=world.geo.json \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist $SHIP; then
            echo "::error::The SUPERSEDED office address (1007 Chestnut St / Newton MA / 02464 / 02458, or Newton claimed as Y7 location in any alphabet) appears on a shipping surface. The canonical address is 6 Harding Rd, Natick, MA 01760. Newton as a SERVICE AREA is fine - do not remove /newton-auto-transport or its copy."
            exit 1
          fi
          echo "OK: no superseded office address on any shipping surface, latin or Cyrillic"

      - name: Check sitemap for broken /en/ hreflang
        run: |
          if grep -n "/en/" public/sitemap.xml; then
            echo "::error::Sitemap contains /en/ hreflang URLs. The site has no /en/ prefix routes - English is the default."
            exit 1
          fi
          if grep -nE 'href="https://www\.y7agency\.com/en"' public/sitemap.xml; then
            echo "::error::Sitemap contains /en hreflang URL. The site has no /en prefix routes."
            exit 1
          fi
          echo "OK: no /en/ in sitemap"

      - name: Check sitemap URL count (must be 138)
        # [WEBFIX-T00] 133 -> 138, measured on public/sitemap.xml at 87614c8.
        run: |
          COUNT=$(grep -c "<loc>" public/sitemap.xml || echo 0)
          if [ "$COUNT" -ne 138 ]; then
            echo "::error::Sitemap has $COUNT URLs, expected 138. If you intentionally added/removed pages, update this check."
            exit 1
          fi
          echo "OK: sitemap has 138 URLs"

      - name: Check for DaytonaCargo in Ukrainian pages
        run: |
          if grep -rn "DaytonaCargo" src/pages/intl/Ukraine* src/locales/ua/ 2>/dev/null; then
            echo "::error::Found DaytonaCargo in Ukrainian pages or ua locale strings. Ukrainian content is Y7-centric (no sister-company mentions)."
            exit 1
          fi
          echo "OK: Ukrainian pages are Y7-centric"

      - name: Check for external daytonacargo.com links site-wide
        run: |
          if grep -rn 'href="https://daytonacargo' src/ --include="*.jsx" --include="*.json" 2>/dev/null; then
            echo "::error::Found external daytonacargo.com link. Ocean freight is presented as Y7 full-cycle capability via an affiliated company — no external links (SEOAI-T01)."
            exit 1
          fi
          echo "OK: no external daytonacargo.com links"

      - name: Check sitemap fake intl URLs
        # [WEBFIX-T00] Twelve patterns REMOVED from this list, deliberately:
        #   /pl/quote /ua/quote /ru/quote, /pl/faq /ua/faq /ru/faq,
        #   /pl/about /ua/about /ru/about, /pl/ports/ /ua/ports/ /ru/ports/
        # Every one of them is a real, prerendered page (src/App.jsx routes,
        # dist/valid-routes.json; 5/5/5/30 sitemap entries each at 87614c8):
        # /quote, /faq, /about and the six /ports/* pages exist in all four
        # locales. The rule was banning pages that ship. Do not put them back.
        # /{pl,ua,ru}/dealer-quote stays: that page has NO localized route and
        # must not appear in the sitemap.
        run: |
          FOUND=0
          for pat in "/pl/dealer-quote" "/ua/dealer-quote" "/ru/dealer-quote"; do
            if grep -q "$pat" public/sitemap.xml; then
              echo "::error::Sitemap contains fake intl URL: $pat (no such page exists)"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "OK: no fake intl URLs in sitemap"

      # ============================================================
      # BUILD VERIFICATION
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify prerender count
        run: |
          npm run build 2>&1 | tee build.log
          # [WEBFIX-T00] 138 -> 143, measured: the prerender reports "143 OK, 0 failed"
          # and dist/valid-routes.json carries 143 routes at 87614c8.
          if ! grep -q "143 OK, 0 failed" build.log; then
            echo "::error::Build did not report '143 OK, 0 failed'. Check build.log output above."
            exit 1
          fi
          echo "OK: build complete with 143 OK, 0 failed"

      - name: Verify dist sitemap matches public sitemap
        run: |
          DIST_COUNT=$(grep -c "<loc>" dist/sitemap.xml || echo 0)
          # [WEBFIX-T00] 133 -> 138, same number as the public sitemap step.
          if [ "$DIST_COUNT" -ne 138 ]; then
            echo "::error::dist/sitemap.xml has $DIST_COUNT URLs, expected 138"
            exit 1
          fi
          echo "OK: dist/sitemap.xml has 138 URLs"

      - name: Verify dist contains intl pages
        # [WEBFIX-T00] {pl,ua,ru}/copart-shipping are <Navigate replace> redirects
        # (src/App.jsx: /pl/copart-shipping -> /pl/transport-z-aukcji,
        # /ua/copart-shipping -> /ua/copart-ta-iaai, /ru/copart-shipping -> /ru/copart-i-iaai).
        # A redirect is never prerendered, so the old list could not pass; the
        # three real slugs are asserted instead.
        run: |
          for page in pl pl/transport-z-aukcji pl/ship-my-car ua ua/copart-ta-iaai ua/ship-my-car ru ru/copart-i-iaai ru/ship-my-car; do
            if [ ! -f "dist/$page/index.html" ]; then
              echo "::error::Missing prerendered file: dist/$page/index.html"
              exit 1
            fi
          done
          echo "OK: all 9 intl pages prerendered"

      - name: Verify info@y7agency.com still present
        run: |
          if ! grep -rn "info@y7agency" \
              --include="*.jsx" --include="*.js" --include="*.html" --include="*.json" --include="*.md" --include="*.txt" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist . > /dev/null; then
            echo "::error::info@y7agency.com is missing from the codebase. This email must remain."
            exit 1
          fi
          echo "OK: info@y7agency.com still present"

      - name: Verify Telegram bot link still present
        run: |
          if ! grep -rn "y7dispatch_bot" \
              --include="*.jsx" --include="*.js" --include="*.html" --include="*.json" --include="*.md" --include="*.txt" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist . > /dev/null; then
            echo "::error::Telegram bot link y7dispatch_bot is missing. This link must remain."
            exit 1
          fi
          echo "OK: Telegram bot link still present"

      # ============================================================
      # SOFT CHECKS â€” warn but do not fail
      # ============================================================

      - name: Soft check â€” PLACEHOLDER_ in intl pages
        run: |
          if grep -rn "PLACEHOLDER_" src/pages/intl/ 2>/dev/null; then
            echo "::warning::Found PLACEHOLDER_ markers in intl pages. These should be replaced with real content before merging to main."
          else
            echo "OK: no placeholder markers in intl pages"
          fi
        continue-on-error: true

      - name: Final summary
        if: always()
        run: |
          echo "::notice::Safety check complete. See individual step results above."
